name: Waka Readme

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime Stats
    runs-on: ubuntu-latest
    environment: README_PROFILE
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: "true"
          BLOCKS: "░▒▓█"
          TIME_RANGE: last_7_days
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          LANG_COUNT: 8
          SHOW_PROJECTS: "true"
